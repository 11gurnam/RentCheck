name: RentCheck checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start isolated account backend
        run: |
          mkdir -p work
          npm run backend:start > work/backend-start.log 2>&1
          npm run backend:env
      - run: npm run test:db
      - run: npm run test:integration
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:recovery
      - run: npm run test:operations
      - run: npm run ops:backup-check
      - run: node scripts/check-browser-secrets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            work/recovery-report/
            work/recovery-results/
            work/operations-report/
            work/operations-results/
          retention-days: 7
      - name: Stop isolated backend
        if: always()
        run: npx supabase stop
